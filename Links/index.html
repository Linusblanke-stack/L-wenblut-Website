<style>
:root{
  --void:#0a0705;
  --void-soft:#150d09;
  --panel:#1c130c;
  --wine:#5c1418;
  --wine-bright:#9c2b26;
  --gold:#c8963e;
  --gold-bright:#f0c988;
  --bone:#f4ecdd;
  --smoke:#a4917a;
  --line:rgba(244,236,221,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  background:var(--void);
  color:var(--bone);
  font-family:'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:48px 20px;
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(92,20,24,0.35) 0%,transparent 60%),
    radial-gradient(80% 50% at 85% 110%,rgba(200,150,62,0.14) 0%,transparent 60%);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.14em;text-transform:uppercase;font-size:11px;color:var(--gold);}

.card{
  position:relative;z-index:1;width:100%;max-width:420px;
  text-align:center;
  opacity:0;transform:translateY(24px);
  animation:card-in .8s cubic-bezier(.16,.8,.24,1) .1s forwards;
}
@keyframes card-in{to{opacity:1;transform:translateY(0);}}

.cover-wrap{position:relative;width:200px;height:200px;margin:0 auto 26px;}
.cover{
  width:100%;height:100%;border-radius:20px;object-fit:cover;
  box-shadow:0 24px 60px rgba(0,0,0,0.55);
  position:relative;z-index:1;
}
.cover-glow{
  position:absolute;inset:-14px;border-radius:28px;z-index:0;
  background:conic-gradient(from 0deg,var(--wine),var(--gold),var(--wine-bright),var(--gold-bright),var(--wine));
  filter:blur(22px);opacity:0.55;
  animation:glow-spin 8s linear infinite;
}
@keyframes glow-spin{to{transform:rotate(360deg);}}

.title{font-family:'Fraunces',serif;font-weight:700;font-size:26px;margin-bottom:4px;}
.artist{font-family:'Fraunces',serif;font-style:italic;color:var(--gold-bright);font-size:16px;margin-bottom:6px;}
.sub{color:var(--smoke);font-size:13.5px;margin-bottom:30px;}

.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(200,150,62,0.12);border:1px solid rgba(200,150,62,0.3);
  color:var(--gold-bright);font-size:11.5px;font-weight:600;
  padding:6px 14px;border-radius:100px;margin-bottom:22px;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bright);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

.link-list{display:flex;flex-direction:column;gap:11px;margin-bottom:22px;}
.section-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gold);text-align:left;margin:14px 2px 2px;
}
.section-label:first-child{margin-top:0;}
.link-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-radius:14px;
  border:1px solid var(--line);background:rgba(244,236,221,0.02);
  transition:all .22s ease;
  opacity:0;transform:translateY(14px);
  animation:row-in .6s cubic-bezier(.16,.8,.24,1) forwards;
}
.link-row:hover{border-color:var(--gold);background:rgba(200,150,62,0.08);transform:translateY(-2px);}
.link-row.recommended{border-color:var(--gold);background:linear-gradient(120deg,rgba(92,20,24,0.22),rgba(200,150,62,0.12));}
@keyframes row-in{to{opacity:1;transform:translateY(0);}}
.link-row .ic{width:26px;height:26px;flex-shrink:0;color:var(--bone);}
.link-row .label{flex:1;text-align:left;}
.link-row .name{font-weight:600;font-size:15px;}
.link-row .tag{font-size:11.5px;color:var(--gold-bright);font-weight:600;}
.link-row .arrow{color:var(--smoke);font-size:18px;transition:transform .2s ease;}
.link-row:hover .arrow{transform:translateX(3px);color:var(--gold-bright);}

.utility-row{display:flex;gap:10px;margin-bottom:28px;}
.util-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;border-radius:12px;border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--smoke);transition:all .2s ease;
}
.util-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
.util-btn svg{width:15px;height:15px;}

.footer-tag{color:var(--smoke);font-size:12px;}
.footer-tag a{color:var(--gold-bright);text-decoration:underline;}

.redirect-note{
  display:none;font-size:12.5px;color:var(--smoke);margin-bottom:18px;
  align-items:center;justify-content:center;gap:8px;
}
.redirect-note.show{display:flex;}
.redirect-note button{color:var(--gold-bright);text-decoration:underline;font-weight:600;}

@media(prefers-reduced-motion:reduce){
  .card,.link-row{animation:none;opacity:1;transform:none;}
  .cover-glow,.badge .dot{animation:none;}
}
</style>

  function detectPlatform(){
    const ua = navigator.userAgent || '';
    if(/iphone|ipad|ipod/i.test(ua)) return 'ios';
    if(/android/i.test(ua)) return 'android';
    return 'desktop';
  }
  const platform = detectPlatform();

  // Empfohlenen Link bestimmen: erster Streaming-Link, der die Plattform unterstützt
  const streamingCandidates = RELEASE.links.filter(l => Array.isArray(l.platforms));
  const recommended = streamingCandidates.find(l => l.platforms.includes(platform)) || streamingCandidates[0];

  const listEl = document.getElementById('linkList');
  let rowIndex = 0;
  SECTIONS.forEach(section => {
    const heading = document.createElement('div');
    heading.className = 'section-label';
    heading.textContent = section.label;
    listEl.appendChild(heading);

    section.links.forEach(l => {
      const row = document.createElement('a');
      row.className = 'link-row' + (recommended && l.key === recommended.key ? ' recommended' : '');
      row.href = l.url;
      if(l.key !== 'email'){ row.target = '_blank'; row.rel = 'noopener'; }
      row.style.animationDelay = (rowIndex * 90) + 'ms';
      rowIndex++;
      row.innerHTML = icons[l.key] +
        '<span class="label"><span class="name">' + l.name + '</span>' +
        (recommended && l.key === recommended.key ? '<br><span class="tag">Empfohlen für dein Gerät</span>' : (l.tag ? '<br><span class="tag">' + l.tag + '</span>' : '')) +
        '</span><span class="arrow">→</span>';
      listEl.appendChild(row);
    });
  });

  // ---------- Optionale automatische Weiterleitung mit Countdown ----------
  const params = new URLSearchParams(location.search);
  if(params.get('auto') === '1'){
    const note = document.getElementById('redirectNote');
    const targetSpan = document.getElementById('redirectTarget');
    targetSpan.textContent = recommended.name;
    note.classList.add('show');
    let cancelled = false;
    document.getElementById('cancelRedirect').addEventListener('click', () => {
      cancelled = true;
      note.classList.remove('show');
    });
    setTimeout(() => { if(!cancelled) window.location.href = recommended.url; }, 1800);
  }

  // ---------- Link kopieren ----------
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(window.location.href);
      const original = copyBtn.innerHTML;
      copyBtn.textContent = 'Kopiert ✓';
      setTimeout(() => { copyBtn.innerHTML = original; }, 1600);
    }catch(e){ /* still fine, no crash */ }
  });

  // ---------- Teilen (Web Share API mit Fallback) ----------
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', async () => {
    const shareData = {
      title: 'Löwenblut — Zwischen Kunst und Persönlichkeit',
      text: 'Hör dir das Debütalbum an:',
      url: window.location.href
    };
    if(navigator.share){
      try{ await navigator.share(shareData); }catch(e){ /* Nutzer hat abgebrochen */ }
    } else {
      try{
        await navigator.clipboard.writeText(window.location.href);
        const original = shareBtn.innerHTML;
        shareBtn.textContent = 'Link kopiert ✓';
        setTimeout(() => { shareBtn.innerHTML = original; }, 1600);
      }catch(e){}
    }
  });
